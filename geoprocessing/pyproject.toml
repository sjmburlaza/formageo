[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "formageo-geoprocessing"
version = "0.1.0"
description = "Geospatial processing tools for the FormaGeo platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "geopandas",
    "shapely",
    "pyproj",
    "sqlalchemy",
    "psycopg[binary]",
    "uvicorn[standard]>=0.35,<1"
]

[project.scripts]
formageo-geoprocessing = "formageo.service:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
