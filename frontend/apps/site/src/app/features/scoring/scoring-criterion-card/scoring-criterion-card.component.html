<article class="criterion-card">
  <header>
    <span class="criterion-number">
      {{ (index() + 1).toString().padStart(2, '0') }}
    </span>
    <div>
      <h3>{{ criterion().name }}</h3>
      <p>{{ criterion().description }}</p>
    </div>
    <button
      class="icon-button"
      type="button"
      [attr.aria-label]="'Remove ' + criterion().name"
      (click)="removed.emit(criterion().key)"
    >
      <svg lucideTrash2 aria-hidden="true"></svg>
    </button>
  </header>

  <div class="weight-control">
    <label [for]="'weight-' + criterion().key">Weight</label>
    <input
      [id]="'weight-' + criterion().key"
      type="range"
      min="1"
      max="100"
      step="1"
      [value]="criterion().weight"
      (input)="updateWeight($any($event.target).value)"
    />
    <div class="number-suffix">
      <input
        type="number"
        min="0.01"
        max="100"
        step="0.01"
        [attr.aria-label]="criterion().name + ' weight'"
        [value]="criterion().weight"
        (input)="updateWeight($any($event.target).value)"
      />
      <span>%</span>
    </div>
  </div>

  <div class="criterion-settings">
    <label class="field field--small">
      <span>Direction</span>
      <select
        [value]="criterion().direction"
        (change)="updateDirection($any($event.target).value)"
      >
        <option value="LowerIsBetter">Lower is better</option>
        <option value="HigherIsBetter">Higher is better</option>
      </select>
    </label>
    <label class="field field--small">
      <span>Normalization</span>
      <select
        [value]="criterion().normalizationMethod"
        (change)="updateNormalization($any($event.target).value)"
      >
        <option value="Linear">Linear scale</option>
        <option value="Threshold">Threshold bands</option>
        <option value="Boolean">Yes / no</option>
      </select>
    </label>
    <label class="field field--small">
      <span>Lower threshold</span>
      <div class="number-suffix">
        <input
          type="number"
          [value]="criterion().lowerThreshold"
          (change)="updateLowerThreshold($any($event.target).value)"
        />
        <span>{{ criterion().unit }}</span>
      </div>
    </label>
    <label class="field field--small">
      <span>Upper threshold</span>
      <div class="number-suffix">
        <input
          type="number"
          [value]="criterion().upperThreshold"
          (change)="updateUpperThreshold($any($event.target).value)"
        />
        <span>{{ criterion().unit }}</span>
      </div>
    </label>
  </div>

  <div class="criterion-metadata">
    <span>
      <small>Data source</small>
      <strong>{{ criterion().dataSource }}</strong>
    </span>
    <label>
      <span>When data is missing</span>
      <select
        [value]="criterion().missingDataBehavior"
        (change)="updateMissingBehavior($any($event.target).value)"
      >
        <option value="CannotScore">Block scoring</option>
        <option value="ExcludeAndReweight">Exclude & reweight</option>
        <option value="ScoreZero">Score zero</option>
      </select>
    </label>
  </div>
</article>
