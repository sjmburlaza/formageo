@if (loading()) {
  <article class="project-card project-card--loading" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </article>
} @else if (project(); as project) {
  <article class="project-card">
    <div class="project-card__top">
      <span class="project-card__icon" aria-hidden="true">
        <svg lucideLandPlot></svg>
      </span>
      <details class="project-menu">
        <summary aria-label="Open project menu">
          <svg lucideEllipsis aria-hidden="true"></svg>
        </summary>
        <div>
          <a [routerLink]="['/projects', project.id]">Open workspace</a>
        </div>
      </details>
    </div>

    <div class="project-card__body">
      <h3>{{ project.name }}</h3>
      <p>Created {{ project.createdAtUtc | date: 'mediumDate' }}</p>
    </div>

    <div class="project-card__footer">
      <span>
        <strong>{{ project.siteCount }}</strong>
        {{ project.siteCount === 1 ? 'site' : 'sites' }}
      </span>
      <a class="open-project" [routerLink]="['/projects', project.id]">
        Open project
        <svg lucideArrowRight aria-hidden="true"></svg>
      </a>
    </div>
  </article>
}
